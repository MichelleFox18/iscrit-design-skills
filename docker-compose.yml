services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: design_growth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local bootstrap password}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - design_growth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d design_growth"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  design_growth_data:
